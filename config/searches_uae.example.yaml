# UAE search config (optional second region). Copy to ~/.applypilot/searches_uae.yaml
# to turn it on; delete that file to turn it off. Jobs found here are tagged
# region=UAE (shown in the shortlist CSV) and scored without penalising the
# visa sponsorship they need.
region: UAE
defaults:
  location: Dubai, United Arab Emirates
  distance: 0
  hours_old: 168
  results_per_site: 20
  country_indeed: united arab emirates
sites:
- linkedin
- indeed
locations:
- label: Dubai
  location: Dubai, United Arab Emirates
  remote: false
- label: Abu Dhabi
  location: Abu Dhabi, United Arab Emirates
  remote: false
queries:
- query: Associate Product Manager
  tier: 1
- query: Junior Product Manager
  tier: 1
- query: Product Manager I
  tier: 1
- query: Product Analyst
  tier: 1
- query: Associate Product Analyst
  tier: 2
- query: Technical Product Manager
  tier: 2
- query: Software Engineer I
  tier: 1
- query: Associate Software Engineer
  tier: 1
- query: Frontend Engineer
  tier: 2
- query: Backend Engineer
  tier: 2
- query: Full Stack Developer
  tier: 2
- query: Azure Developer
  tier: 1
- query: Cloud Engineer
  tier: 1
- query: Python Developer
  tier: 2
- query: Data Engineer
  tier: 2
- query: AI Engineer
  tier: 2
- query: Applied AI Engineer
  tier: 2
- query: Forward Deployed Engineer
  tier: 1
- query: Solutions Engineer
  tier: 1
- query: Software Development Engineer
  tier: 1
- query: Business Analyst
  tier: 1
- query: Generative AI Engineer
  tier: 2
- query: Machine Learning Engineer
  tier: 2
- query: Implementation Engineer
  tier: 2
- query: SDET
  tier: 2
- query: Data Analyst
  tier: 2
- query: Associate Program Manager
  tier: 2
- query: Technical Program Manager
  tier: 2
- query: Technical Consultant
  tier: 2
- query: Customer Success Engineer
  tier: 2
- query: Developer Advocate
  tier: 2
location_accept:
- Dubai
- Abu Dhabi
- Sharjah
- United Arab Emirates
- UAE
location_reject_non_remote: []
# Rate-limit handling (same keys work in searches.yaml):
batch_size: 5
search_pause_seconds: 10
batch_pause_seconds: 120
rate_limit_cooldown_seconds: 300
max_total_cooldown_seconds: 3600
# Stop searching after this many minutes so the run moves on to scoring and
# tailoring; the next run continues with the searches that were skipped.
time_budget_minutes: 60
