# Keep only titles containing one of these words (case-insensitive, whole words).
# Leave empty to keep every title (the LLM scorer still filters by fit).
title_keywords:
  - engineer
  - engineering
  - developer
  - software
  - product
  - analyst
  - data
  - cloud
  - devops
  - reliability
  - sre
  - platform
  - backend
  - frontend
  - full stack
  - fullstack
  - python
  - golang
  - ai
  - ml
  - machine learning
  - architect
  - solutions
  - implementation
  - deployed
  - deployment
  - program
  - consultant
  - advocate
  - developer relations
  - sdet
  - qa
  - test
  - customer success

# Drop titles containing any of these words (whole words, case-insensitive).
# Senior titles (senior/staff/lead/principal/...) and "... Manager" (except
# Product / Program / Project Manager) are dropped automatically.
exclude_title_words:
  - principle            # common misspelling of "principal"
  - sales
  - account
  - marketer
  - marketing
  - hr
  - generalist
  - communications
  - recruiter
  - recruiting
  - benefits
  - accounting
  - billing
  - legal
  - grc
  - phd
  - experienced
