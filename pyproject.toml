[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "applypilot"
version = "0.3.0"
description = "AI-powered end-to-end job application pipeline (customized fork)"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.6",
  "beautifulsoup4>=4.12",
  "httpx>=0.24",
  "pandas>=2.0",
  "playwright>=1.40",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
gcp = ["google-cloud-storage>=2.10"]
jobspy = ["python-jobspy>=1.4.1"]

[project.scripts]
applypilot = "applypilot.cli:app"

[project.urls]
Upstream = "https://github.com/Pickle-Pixel/ApplyPilot"
